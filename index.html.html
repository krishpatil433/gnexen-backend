<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNEXEN REWARD</title>
    <meta http-equiv="refresh" content="2;url=user.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .logo {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #6C63FF, #8B83FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo span { -webkit-text-fill-color: white; }
        .loader {
            border: 4px solid rgba(255,255,255,0.08);
            border-top: 4px solid #6C63FF;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .text-muted { color: #8888aa; }
        a { color: #6C63FF; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">GNEXEN<span>REWARD</span></div>
        <div class="loader"></div>
        <p>Welcome to GNEXEN REWARD</p>
        <p class="text-muted">Redirecting to dashboard...</p>
        <p class="text-muted" style="margin-top:20px;font-size:14px;">
            <a href="user.html">Click here if not redirected</a>
        </p>
    </div>
</body>
</html>
